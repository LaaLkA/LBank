<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Поступления пользователя</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="main-container">
    <div class="main-container-left">
        <aside class="sidebar">
            <div class="user-info">
                <div class="user-data">
                    <img src="/images/user-icon.png" alt="User Icon" class="avatar">
                    <p class="username"><span id="userName">USERNAME</span></p>
                </div>
                <div class="balance">
                    <img src="/images/balance-icon.png" alt="BalanceIcon" class="balance-ico">
                    <p class="balance-count"><span id="balanceValue">9 999</span> руб.</p>
                </div>
            </div>
        </aside>
        <nav class="menu">
            <ul>
                <li><a href="/income">Поступления</a></li>
                <li><a href="/expenses">Расходы</a></li>
                <li><a href="/transfer">Перевод</a></li>
                <li><a href="/profile">Профиль</a></li>
            </ul>
        </nav>
    </div>

    <div>
        <h1>Ваши поступления</h1>
        <table id="incomeTable" border="1">
            <thead>
            <tr>
                <th>Отправитель</th>
                <th>Получатель</th>
                <th>Сумма</th>
            </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>
</div>


<script th:src="@{/js/income.js}"></script>
</body>
</html>
